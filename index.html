<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フィールドノート</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FieldNote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
</head>
<body>
<div id="map"></div>
<div id="crosshair" hidden></div>

<!-- 上部ステータス -->
<header id="status" class="glass">
  <div id="status-main">
    <span id="gps-dot" class="dot off"></span>
    <span id="st-coord">位置情報を待機中…</span>
  </div>
  <div id="status-sub">
    <span id="st-acc"></span>
    <span id="st-elev"></span>
    <span id="st-mesh"></span>
    <span id="st-sun"></span>
  </div>
  <div id="st-addr"></div>
</header>

<!-- 右側ボタン -->
<nav id="fabs-right">
  <button class="fab fab-lang" id="btn-lang" type="button" title="English" aria-label="Switch to English" translate="no">EN</button>
  <button class="fab" id="btn-layers" title="地図の切替" aria-label="地図の切替">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Zm-7.5 8.6L2 13l10 5 10-5-2.5-1.4L12 15.5l-7.5-3.9Zm0 4.4L2 17.4l10 5 10-5-2.5-1.4-7.5 3.9-7.5-3.9Z"/></svg>
  </button>
  <button class="fab" id="btn-search" title="地名検索" aria-label="地名検索">
    <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
  </button>
  <button class="fab" id="btn-measure" title="距離・面積の計測" aria-label="計測">
    <svg viewBox="0 0 24 24"><path d="M3 17.3 17.3 3 21 6.7 6.7 21 3 17.3Zm3.4-.6 1.4 1.4 1.1-1.1-1.4-1.4 1-1 2.1 2.1 1.1-1.1-2.1-2.1 1-1 1.4 1.4 1.1-1.1-1.4-1.4 1-1 2.1 2.1 1.1-1.1L15 9.7l1-1 1.4 1.4 1.1-1.1-2.8-2.8L5.3 15.6l1.1 1.1Z"/></svg>
  </button>
  <button class="fab" id="btn-track" title="軌跡の記録" aria-label="軌跡の記録">
    <svg viewBox="0 0 24 24"><path d="M6 3a3 3 0 0 0-1 5.8V21h2V8.8A3 3 0 0 0 6 3Zm12 10a3 3 0 0 0-2.8 2H11c-1.1 0-2-.9-2-2s.9-2 2-2h4a4 4 0 0 0 0-8h-4v2h4a2 2 0 1 1 0 4h-4a4 4 0 0 0 0 8h4.2A3 3 0 1 0 18 13Z"/></svg>
  </button>
  <button class="fab" id="btn-crosshair" title="中心十字線" aria-label="中心十字線">
    <svg viewBox="0 0 24 24"><path d="M11 2h2v6h-2V2Zm0 14h2v6h-2v-6ZM2 11h6v2H2v-2Zm14 0h6v2h-6v-2Z"/></svg>
  </button>
  <button class="fab" id="btn-north" title="北を上にする" aria-label="北を上にする" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 2 7.5 12h9L12 2Z" fill="#d0021b"/><path d="M12 22l4.5-10h-9L12 22Z" fill="currentColor" opacity=".55"/><text x="12" y="9.6" text-anchor="middle" font-size="5" font-weight="700" fill="#fff">N</text></svg>
  </button>
  <button class="fab" id="btn-locate" title="現在地（タップで追従）" aria-label="現在地">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
  </button>
  <button class="fab" id="btn-data" type="button" title="読み込み・書き出し" aria-label="読み込み・書き出し">
    <svg viewBox="0 0 24 24" class="i-updown" aria-hidden="true"><path d="M7.5 20V5.5M3.5 9.5l4-4 4 4M16.5 4v14.5M12.5 14.5l4 4 4-4"/></svg>
  </button>
</nav>

<!-- 計測結果 -->
<div id="measure-bar" class="glass" hidden>
  <span id="measure-text">地図をタップして点を追加</span>
  <button id="measure-undo" class="chip">1つ戻す</button>
  <button id="measure-prof" class="chip">断面図</button>
  <button id="measure-close" class="chip">終了</button>
</div>

<!-- 下部バー -->
<footer id="bottombar" class="glass">
  <button class="bb" id="btn-list"><svg viewBox="0 0 24 24"><path d="M4 6h2v2H4V6Zm4 0h12v2H8V6Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Z"/></svg><span>一覧<b id="memo-count"></b></span></button>
  <button class="bb primary" id="btn-add-here"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg><span>現在地にメモ</span></button>
  <button class="bb cam" id="btn-camera" aria-label="撮影"><svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg><span>撮影</span></button>
  <button class="bb" id="btn-add-center"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><span>中心にメモ</span></button>
  <button class="bb" id="btn-menu"><svg viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span>保存/設定<b id="unsaved-badge" hidden>!</b></span></button>
</footer>

<!-- ボトムシート（共通） -->
<div id="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button id="sheet-close" class="icon-btn" aria-label="閉じる">✕</button>
  </div>
  <div id="sheet-body"></div>
</section>

<div id="toast" hidden></div>

<!-- カメラ（撮影した写真は端末内に保存） -->
<input id="camera-input" type="file" accept="image/*" capture="environment" hidden>

<!-- 写真ビューア -->
<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真">
  <div id="v-stage"><img id="v-img" alt=""><div id="v-card" hidden></div></div>
  <div id="v-pb" hidden>
    <div id="v-pb-text"></div>
    <div class="v-pb-act">
      <button id="v-fav" class="v-btn wide" type="button">お気に入り</button>
      <span id="v-fav-size"></span>
      <span class="v-spacer"></span>
      <div class="v-mode" role="group" aria-label="再生モード">
        <span class="v-mode-lab">再生モード</span>
        <button id="v-first" class="v-ico" type="button" title="最初から" aria-label="最初から">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14" /><path d="M18 6l-9 6 9 6z" /></svg>
        </button>
        <button id="v-favonly" class="v-ico" type="button" title="お気に入りだけ" aria-label="お気に入りだけ" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" /></svg>
        </button>
        <button id="v-play" class="v-ico" type="button" title="自動再生" aria-label="自動再生" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13M16 5.5v13" /></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="v-top">
    <div class="v-info"><div id="v-title"></div><div id="v-meta"></div></div>
    <button id="v-close" class="v-btn" aria-label="閉じる">✕</button>
  </div>
  <div class="v-bottom">
    <button id="v-prev" class="v-btn" aria-label="前の写真">‹</button>
    <button id="v-count" type="button" aria-label="番号を指定して移動"></button>
    <button id="v-next" class="v-btn" aria-label="次の写真">›</button>
    <span class="v-spacer"></span>
    <button id="v-zout" class="v-btn" aria-label="縮小">−</button>
    <span id="v-zoom"></span>
    <button id="v-zin" class="v-btn" aria-label="拡大">+</button>
    <button id="v-save" class="v-btn wide">保存</button>
    <button id="v-map" class="v-btn wide">地図</button>
    <button id="v-edit" class="v-btn wide">メモ</button>
  </div>
</div>

<!-- テンプレート -->
<template id="tpl-memo-form">
  <form id="memo-form" autocomplete="off">
    <div class="loc-box">
      <div class="loc-coord"></div>
      <div class="loc-meta"></div>
    </div>
    <label>タイトル<input name="title" type="text" placeholder="例：旧街道の石碑" maxlength="200"></label>
    <div class="lbl">カテゴリ<div class="cat-chips"></div></div>
    <div class="cat-mgr-box" hidden></div>
    <label>メモ・聞き取り<textarea name="note" rows="5" placeholder="観察内容・聞き取り・気づいたこと"></textarea></label>
    <div class="voice-box"></div>
    <label>タグ（カンマ区切り）<input name="tags" type="text" placeholder="例：坂, 石垣, 明治"></label>
    <div class="photo-row">
      <div class="photo-btns">
        <label class="btn secondary file-btn">撮影して追加
          <input name="photoCam" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn secondary file-btn">フォルダの画像を追加
          <input name="photoPick" type="file" accept="image/*" multiple hidden>
        </label>
      </div>
      <div class="photo-thumbs"></div>
    </div>
    <label class="inline"><input name="useHeading" type="checkbox"> 撮影方向（端末の向き）を記録 <span class="heading-val"></span></label>
    <div class="form-actions">
      <button type="button" class="btn danger" data-act="delete" hidden>削除</button>
      <button type="button" class="btn secondary" data-act="move" hidden>位置を地図中心へ</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script src="vector.js"></script>
<script src="dem.js"></script>
<script src="reinfo-catalog.js"></script>
<script src="datalayers.js"></script>
<script src="estat-gis-catalog.js"></script>
<script src="estatgis.js"></script>
<script src="boundary.js"></script>
<script src="importlayers.js"></script>
<script src="georef.js"></script>
<script src="print.js"></script>
<script src="fieldtools.js"></script>
<script src="extra-data.js"></script>
<script src="extralayers.js"></script>
<script src="survey.js"></script>
<script src="memo-tools.js"></script>
<script src="cluster.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>

</body>
</html>
